# Breaks job-env: env on the Scorecard job.
on: workflow_call
permissions: {}
jobs:
  scorecard:
    runs-on: ubuntu-24.04
    env:
      LEVEL: job
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
