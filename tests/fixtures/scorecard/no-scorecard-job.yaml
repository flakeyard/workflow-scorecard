# Breaks scorecard-job: no job runs scorecard-action.
on: workflow_call
permissions: {}
jobs:
  scorecard:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
