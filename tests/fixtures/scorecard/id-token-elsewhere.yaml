# Breaks id-token-elsewhere and one-job: another job can write id-token.
on: workflow_call
permissions: {}
jobs:
  scorecard:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
  other:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
