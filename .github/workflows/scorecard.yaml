# Reusable Scorecard workflow. A repository calls it from its own
# scorecard.yaml; the job runs OpenSSF Scorecard on the default branch,
# publishes the results of the calling repository and uploads them to its
# code scanning. The Scorecard server verifies this file before it accepts
# the results, so it holds only the Scorecard job, with no env, defaults,
# container or services and only the actions the server allows. The other
# triggers run Scorecard for this repository itself (FY-0034).
name: scorecard

on:
  workflow_call:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions: {}

# A newer run of the same workflow and ref cancels an older one. In a call,
# github.workflow and github.ref are those of the caller; the prefix keeps the
# group apart from a group of the caller, which would deadlock the call.
concurrency:
  group: workflow-scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: scorecard
    # Results are accepted only for the default branch. A schedule event has
    # no repository in its payload and always runs on the default branch.
    if: >-
      ${{ github.event_name == 'schedule'
          || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # workflow runs, needed in private repositories
      contents: read # checkout and the repository through the API
      id-token: write # signs the published results
      security-events: write # uploads the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
